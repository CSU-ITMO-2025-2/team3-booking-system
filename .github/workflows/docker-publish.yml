name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Сборка Booking Service
      - name: Build and Push Booking Service
        uses: docker/build-push-action@v4
        with:
          context: ./booking-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/booking-service:latest  # секрет username, чтобы были мелкие буквы

      # Сборка Notification Service
      - name: Build and Push Notification Service
        uses: docker/build-push-action@v4
        with:
          context: ./notification-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notification-service:latest

      # Сборка Payment Service
      - name: Build and Push Payment Service
        uses: docker/build-push-action@v4
        with:
          context: ./payment-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/payment-service:latest